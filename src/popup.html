<!doctype html>
<html lang="en-US" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChatGPT Tracker</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="topbar"><h1>ChatGPT Tracker</h1><button id="open-options" type="button" data-i18n="settings" data-i18n-title="settings">Settings</button></header>
      <section class="controls">
        <label for="active-mode" data-i18n="currentMode">Current mode</label><select id="active-mode"></select>
        <div class="toggles">
          <label><input id="auto-track" type="checkbox"><span data-i18n="autoTrack">Auto track</span></label>
          <label><input id="auto-detect" type="checkbox"><span data-i18n="autoDetect">Auto-detect mode</span></label>
          <label><input id="show-widget" type="checkbox"><span data-i18n="showWidget">Floating counter</span></label>
        </div>
      </section>
      <section id="stats" class="stats"></section>
      <div class="reset-row"><span class="meta" id="count-since"></span><button id="reset-counts" type="button" data-i18n="resetCounts">Reset counts</button></div>
      <section class="actions">
        <button id="manual-add" type="button">+1</button><button id="undo" type="button" data-i18n="undo">Undo</button>
        <button id="open-chatgpt" type="button" data-i18n="openChatgpt">Open ChatGPT</button>
      </section>
      <details id="more-panel" class="more">
        <summary data-i18n="more">More features</summary>
        <div class="more-body">
          <section class="more-block">
            <div class="more-block-head"><label class="more-title" for="window-range" data-i18n="timeStats">Time-range statistics</label><select id="window-range"></select></div>
            <div id="window-stats" class="window-stats"></div>
          </section>
          <section class="more-block">
            <div class="more-block-head"><label class="more-title" for="daily-mode" data-i18n="dailyStats">Daily statistics</label><select id="daily-mode"></select></div>
            <div id="daily-stats" class="daily-stats"></div>
          </section>
          <section class="more-block"><span class="more-title" data-i18n="recent">Recent records</span><div id="recent-list" class="recent-list"></div></section>
          <button id="export-json" type="button" data-i18n="export">Export JSON</button>
        </div>
      </details>
      <p id="popup-error" role="status" hidden></p>
    </main>
    <script src="shared.js"></script>
    <script src="site-locales.js"></script>
    <script src="ui-locales.js"></script>
    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
